apiVersion: v1
kind: Namespace
metadata:
  name: thr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda
  namespace: thr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camunda
  template:
    metadata:
      labels:
        app: camunda
    spec:
      containers:
        - name: camunda
          image: camunda/camunda-bpm-platform:run-latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: camunda-service
  namespace: thr
spec:
  selector:
    app: camunda
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP